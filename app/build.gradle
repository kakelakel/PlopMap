plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'se.plopmap'
    compileSdk 35

    defaultConfig {
        applicationId 'se.plopmap'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
